<!DOCTYPE html>
<html>
<head>
    <title>脚本管理</title>
    {% include 'system/common/header.html' %}
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label">脚本名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="script_name" lay-verify="title" autocomplete="off" placeholder="请输入"
                               class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">脚本入参</label>
                    <div class="layui-input-block">
                        <input type="text" name="input_params" lay-verify="title" autocomplete="off" placeholder="请输入"
                               class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">用户验证</label>
                    <div class="layui-input-block">
                        <input type="text" name="auth_info" lay-verify="title" autocomplete="off" placeholder="请输入"
                               class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">脚本路径</label>
                    <div class="layui-input-block">
                        <input type="text" name="script_path" lay-verify="title" autocomplete="off" placeholder="请输入"
                               class="layui-input">
                    </div>
                </div>



                <div class="layui-form-item">
                    <label class="layui-form-label">脚本描述</label>
                    <div class="layui-input-block">
                        <input type="text" name="script_desc" lay-verify="title" autocomplete="off" placeholder="请输入"
                               class="layui-textarea">
                    </div>
                </div>


            <div class="layui-form-item">
              <label class="layui-form-label">脚本类型</label>
              <select lay-filter="demo-select-filter">
                <option value="">请选择</option>
                <option value="0">基本脚本</option>
                <option value="1">接口脚本</option>
                <option value="2">定时脚本</option>
              </select>
               <div/>
            </div>


                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="pear-btn pear-btn-primary pear-btn-sm" lay-submit="" lay-filter="script-save">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="pear-btn pear-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
{% include 'system/common/footer.html' %}



<script>
layui.use(['form', 'jquery', 'layer'], function () {
    let form = layui.form;
    let $ = layui.jquery;
    let layer = layui.layer;

    // 用于存储 task_type 的变量
    let task_type = '';

    // 监听 select 变化事件，获取 task_type 值
    form.on('select(demo-select-filter)', function(data){
        task_type = data.value; // 获得被选中的值
    });

    // 监听表单提交事件
    form.on('submit(script-save)', function (data) {
        // 将 task_type 添加到 data.field 中
        data.field.task_type = task_type;

        $.ajax({
            url: '/ems/script/save',
            data: JSON.stringify(data.field),
            dataType: 'json',
            contentType: 'application/json',
            type: 'post',
            success: function (result) {
                if (result.success) {
                    layer.msg(result.msg, { icon: 1, time: 1000 }, function () {
                        parent.layer.close(parent.layer.getFrameIndex(window.name)); // 关闭当前页
                        parent.layui.table.reload('script-table');
                    });
                } else {
                    layer.msg(result.msg, { icon: 2, time: 1000 });
                }
            },
            error: function (xhr, status, error) {
                layer.msg('请求失败，请稍后再试', { icon: 2, time: 1000 });
            }
        });
        return false; // 阻止表单默认提交行为
    });
});
</script>
</body>
</html>
